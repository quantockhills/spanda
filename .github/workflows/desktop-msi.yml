name: Desktop MSI (Windows)

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build MSI
        shell: bash
        run: ./gradlew :desktop:packageMsi --no-daemon

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: spanda-windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi

      - name: Create release with MSI
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          MSI=$(ls desktop/build/compose/binaries/main/msi/*.msi | head -1)
          gh release create "$GITHUB_REF_NAME" "$MSI" \
            --title "Spanda Desktop $GITHUB_REF_NAME" \
            --notes "Windows installer (MSI). Four texts: Śivabodhaviṃśikā, Amṛtādistavaḥ, Saṃvarta Stavaḥ, Bhagavad Gītā." \
            || gh release upload "$GITHUB_REF_NAME" "$MSI" --clobber
