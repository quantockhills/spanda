name: Windows MSI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build MSI
        shell: bash
        run: ./gradlew :desktop:packageMsi --no-daemon

      - name: Dump jpackage logs on failure
        if: failure()
        shell: bash
        run: |
          cat desktop/build/compose/logs/packageMsi/*err*.txt 2>/dev/null || true
          cat desktop/build/compose/logs/packageMsi/*out*.txt 2>/dev/null || true

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: spanda-windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
